<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One program</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #ffffff;
      background-color: #000000;
      margin: 20px;
    }

  </style>
</head>
<body>
  <h1>Hello World!</h1>
  <p>Esse é o meu primeiro programa em HTML.</p>
  <script>
    var n1 = Number(window.prompt('Digite o primeiro número:'));
    var n2 = Number(window.prompt('Digite o segundo número:'));
    var soma = n1 + n2;
    window.alert('A soma dos dois números é: '+ String(soma));

  </script>
</body>
</html>
