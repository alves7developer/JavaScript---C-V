<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One program</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #ffffff;
      background-color: #000000;
      margin: 20px;
    }

  </style>
</head>
<body>
  <h1>Hello World!</h1>
  <p>Esse é o meu primeiro programa em HTML.</p>
  <script>
    var nome = window.prompt('Qual o seu nome?'); // Pergunta e armazena o nome
    window.alert('É um grande prazer te conhecer, '+ nome + '!'); // Exibe a mensagem de boas-vindas, com o nome vindo da variável
  </script>
</body>
</html>
